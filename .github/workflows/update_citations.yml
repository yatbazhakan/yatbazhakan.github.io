name: Update Citation Counts

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run citation update script
        run: python scripts/update_citations.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/citations.json
          if ! git diff --staged --quiet; then
            git commit -m "Automated update of citation counts"
            git push
          else
            echo "No changes in citation counts."
          fi
