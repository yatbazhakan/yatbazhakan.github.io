  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "name": "Dr. Hakan Yekta Yatbaz",
      "title": "Lecturer in Autonomous Systems",
      "department": "School of Electronics, Electrical Engineering and Computer Science",
      "tagline": "Safe, reliable, and introspective perception for autonomous systems and intelligent vehicles.",
      "email": "h.yatbaz@qub.ac.uk",
      "office": "Ashby Building, Room 08.010",
      "scholarUrl": "https:\/\/scholar.google.com\/citations?user=5Q596f4AAAAJ",
      "linkedinUrl": "https:\/\/www.linkedin.com\/in\/hakanyektayatbaz\/",
      "githubUrl": "https:\/\/github.com\/yatbazhakan",
      "accentColor": "#C8102E",
      "showPhDBadge": true
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
      const [menuOpen, setMenuOpen] = React.useState(false);
      const [citationData, setCitationData] = React.useState(null);

      React.useEffect(() => {
        fetch('citations.json?v=' + Date.now())
          .then(r => r.json())
          .then(d => { if (d && d.stats) setCitationData(d); })
          .catch(e => console.debug('citations.json load note:', e));
      }, []);

      const accent = tweaks.accentColor;
      const accentDark = tweaks.accentColor === '#C8102E' ? '#a00d24' : tweaks.accentColor;

      const css = `
    :root {
      --qub-red: ${accent};
      --qub-red-dark: ${accentDark};
    }
  `;

      return (
        <>
          <style>{css}</style>
          <Nav tweaks={tweaks} menuOpen={menuOpen} setMenuOpen={setMenuOpen} />
          <main>
            <Hero tweaks={tweaks} />
            <About tweaks={tweaks} citationData={citationData} />
            <Research />
            <PhDSection tweaks={tweaks} />
            <Publications tweaks={tweaks} citationData={citationData} />
            <News />
            <AcademicServices />
            <Contact tweaks={tweaks} />
          </main>
          <Footer tweaks={tweaks} />
          <TweaksUI tweaks={tweaks} setTweak={setTweak} />
        </>
      );
    }

    /* ── NAV ── */
    function Nav({ tweaks, menuOpen, setMenuOpen }) {
      const [scrolled, setScrolled] = React.useState(false);
      React.useEffect(() => {
        const fn = () => setScrolled(window.scrollY > 40);
        window.addEventListener('scroll', fn);
        return () => window.removeEventListener('scroll', fn);
      }, []);

      const links = [
        { label: 'About', href: '#about' },
        { label: 'Research', href: '#research' },
        { label: 'PhD', href: '#phd-opportunities' },
        { label: 'Publications', href: 'publications.html' },
        { label: 'Teaching', href: 'teaching.html' },
        { label: 'Supervision', href: 'supervision.html' },
        { label: 'Contact', href: '#contact' },
      ];

      return (
        <nav style={{
          position: 'fixed', top: 0, left: 0, right: 0, zIndex: 1000,
          background: scrolled ? 'rgba(26,31,46,0.97)' : 'transparent',
          backdropFilter: scrolled ? 'blur(12px)' : 'none',
          transition: 'background 0.3s, box-shadow 0.3s',
          boxShadow: scrolled ? '0 2px 20px rgba(0,0,0,0.25)' : 'none',
        }}>
          <div style={{ maxWidth: 'var(--max-w)', margin: '0 auto', padding: '0 24px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', height: 64 }}>
            <a href="#top" style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
              <QubLogo />
              <span style={{ color: '#fff', fontWeight: 600, fontSize: 14, letterSpacing: '0.02em', display: 'flex', flexDirection: 'column', lineHeight: 1.2 }}>
                <span style={{ opacity: 0.7, fontWeight: 400, fontSize: 11 }}>Queen's University Belfast</span>
                <span>{tweaks.name.replace(/^Dr\.\s|^Prof\.\s/, '').split(' ').slice(-1)[0]}</span>
              </span>
            </a>
            {/* Desktop links */}
            <div style={{ display: 'flex', gap: 8, alignItems: 'center' }} className="desktop-nav">
              {links.map(l => (
                <a key={l.label} href={l.href}
                  style={{ color: 'rgba(255,255,255,0.82)', fontSize: 13, fontWeight: 500, padding: '6px 12px', borderRadius: 6, transition: 'color 0.2s, background 0.2s' }}
                  onMouseEnter={e => { e.target.style.color = '#fff'; e.target.style.background = 'rgba(255,255,255,0.1)'; }}
                  onMouseLeave={e => { e.target.style.color = 'rgba(255,255,255,0.82)'; e.target.style.background = 'transparent'; }}
                >{l.label}</a>
              ))}
              <a href={`mailto:${tweaks.email}`}
                style={{ marginLeft: 8, background: 'var(--qub-red)', color: '#fff', padding: '8px 18px', borderRadius: 24, fontSize: 13, fontWeight: 600, transition: 'background 0.2s' }}
                onMouseEnter={e => e.target.style.background = 'var(--qub-red-dark)'}
                onMouseLeave={e => e.target.style.background = 'var(--qub-red)'}
              >Get in Touch</a>
            </div>
            {/* Hamburger */}
            <button onClick={() => setMenuOpen(o => !o)}
              style={{ background: 'none', border: 'none', cursor: 'pointer', display: 'none', flexDirection: 'column', gap: 5, padding: 8 }}
              className="hamburger" aria-label="Menu">
              {[0, 1, 2].map(i => <span key={i} style={{ display: 'block', width: 24, height: 2, background: '#fff', borderRadius: 2, transition: 'all 0.2s', transform: menuOpen ? (i === 0 ? 'translateY(7px) rotate(45deg)' : i === 2 ? 'translateY(-7px) rotate(-45deg)' : 'scaleX(0)') : 'none' }}></span>)}
            </button>
          </div>
          {/* Mobile menu */}
          {menuOpen && (
            <div style={{ background: 'rgba(26,31,46,0.98)', padding: '12px 24px 24px', display: 'flex', flexDirection: 'column', gap: 4 }}>
              {links.map(l => (
                <a key={l.label} href={l.href}
                  onClick={() => setMenuOpen(false)}
                  style={{ color: 'rgba(255,255,255,0.85)', fontSize: 16, fontWeight: 500, padding: '12px 0', borderBottom: '1px solid rgba(255,255,255,0.08)' }}>
                  {l.label}
                </a>
              ))}
              <a href={`mailto:${tweaks.email}`} onClick={() => setMenuOpen(false)}
                style={{ marginTop: 12, background: 'var(--qub-red)', color: '#fff', padding: '12px 18px', borderRadius: 8, fontSize: 15, fontWeight: 600, textAlign: 'center' }}>
                Get in Touch
              </a>
            </div>
          )}
          <style>{`
        @media (max-width: 768px) {
          .desktop-nav { display: none !important; }
          .hamburger { display: flex !important; }
        }
      `}</style>
        </nav>
      );
    }

    /* ── HERO ── */
    function Hero({ tweaks }) {
      return (
        <section id="top" style={{ minHeight: '88vh', background: 'var(--qub-navy)', display: 'flex', alignItems: 'center', position: 'relative', overflow: 'hidden' }}>
          {/* Subtle ambient lighting */}
          <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', pointerEvents: 'none' }}>
            <div style={{ position: 'absolute', top: '-15%', right: '-5%', width: '50%', height: '130%', background: 'radial-gradient(ellipse at center, rgba(200,16,46,0.12) 0%, transparent 70%)' }}></div>
          </div>

          <div style={{ maxWidth: 'var(--max-w)', margin: '0 auto', padding: '120px 24px 80px', width: '100%', display: 'grid', gridTemplateColumns: '1fr auto', gap: 60, alignItems: 'center', position: 'relative' }}>
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 20 }}>
                <span style={{ display: 'block', width: 28, height: 2, background: 'var(--qub-red)', borderRadius: 1 }}></span>
                <span style={{ color: 'rgba(255,255,255,0.7)', fontSize: 13, fontWeight: 500, letterSpacing: '0.06em', textTransform: 'uppercase' }}>{tweaks.department}</span>
              </div>
              <h1 style={{ fontFamily: "'Playfair Display', serif", fontSize: 'clamp(2.4rem, 4.8vw, 3.8rem)', fontWeight: 700, color: '#fff', lineHeight: 1.15, marginBottom: 16 }}>
                {tweaks.name}
              </h1>
              <p style={{ fontSize: 'clamp(1.05rem, 1.8vw, 1.25rem)', color: 'rgba(255,255,255,0.92)', fontWeight: 500, marginBottom: 14 }}>
                {tweaks.title} · <span style={{ color: 'rgba(255,255,255,0.65)' }}>Queen's University Belfast</span>
              </p>
              <p style={{ fontSize: '15.5px', color: 'rgba(255,255,255,0.75)', maxWidth: 620, marginBottom: 28, lineHeight: 1.75 }}>
                {tweaks.tagline}
              </p>
              {tweaks.showPhDBadge && (
                <div style={{ display: 'inline-flex', alignItems: 'center', gap: 8, background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)', borderRadius: 20, padding: '6px 14px', marginBottom: 28 }}>
                  <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--qub-red)', display: 'block' }}></span>
                  <span style={{ color: 'rgba(255,255,255,0.85)', fontSize: 12.5, fontWeight: 500 }}>Open to PhD supervision inquiries</span>
                </div>
              )}
              <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
                <a href="#about" style={{ background: 'var(--qub-red)', color: '#fff', padding: '11px 22px', borderRadius: 6, fontWeight: 600, fontSize: 13.5, transition: 'background 0.2s', display: 'inline-block' }}
                  onMouseEnter={e => e.target.style.background = 'var(--qub-red-dark)'}
                  onMouseLeave={e => e.target.style.background = 'var(--qub-red)'}>
                  Research Overview
                </a>
                <a href="publications.html" style={{ background: 'transparent', color: '#fff', padding: '11px 22px', borderRadius: 6, fontWeight: 500, fontSize: 13.5, border: '1px solid rgba(255,255,255,0.22)', transition: 'background 0.2s', display: 'inline-block' }}
                  onMouseEnter={e => e.target.style.background = 'rgba(255,255,255,0.08)'}
                  onMouseLeave={e => e.target.style.background = 'transparent'}>
                  Publications
                </a>
                <a href="#contact" style={{ background: 'transparent', color: 'rgba(255,255,255,0.75)', padding: '11px 18px', borderRadius: 6, fontWeight: 500, fontSize: 13.5, transition: 'color 0.2s', display: 'inline-block' }}
                  onMouseEnter={e => e.target.style.color = '#fff'}
                  onMouseLeave={e => e.target.style.color = 'rgba(255,255,255,0.75)'}>
                  Contact &amp; Inquiries →
                </a>
              </div>
            </div>
            {/* Photo */}
            <div style={{ width: 'clamp(160px, 18vw, 250px)', flexShrink: 0 }} className="hero-photo">
              <div style={{ aspectRatio: '3/4', borderRadius: 12, overflow: 'hidden', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.1)', display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative' }}>
                <img src="photo.jpg" alt="Dr. Hakan Yekta Yatbaz"
                  style={{ width: '100%', height: '100%', objectFit: 'cover' }}
                  onError={e => { e.target.style.display = 'none'; e.target.nextSibling.style.display = 'flex'; }}
                />
                <div style={{ display: 'none', flexDirection: 'column', alignItems: 'center', gap: 10, padding: 20 }}>
                  <svg viewBox="0 0 160 200" style={{ width: '70%', opacity: 0.25 }}><circle cx="80" cy="70" r="40" fill="#fff" /><ellipse cx="80" cy="160" rx="60" ry="50" fill="#fff" /></svg>
                  <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.5)', textAlign: 'center', lineHeight: 1.5 }}>Add photo.jpg to project folder</div>
                </div>
              </div>
            </div>
          </div>
          <style>{`
        @media (max-width: 640px) { .hero-photo { display: none; } }
      `}</style>
        </section>
      );
    }

    /* ── ABOUT ── */
    function About({ tweaks, citationData }) {
      const stats = [
        { n: citationData?.stats?.citations ? String(citationData.stats.citations) : '371', label: 'Citations' },
        { n: citationData?.stats?.publications ? String(citationData.stats.publications) : '21', label: 'Publications' },
        { n: citationData?.stats?.h_index ? String(citationData.stats.h_index) : '9', label: 'h-index' },
        { n: citationData?.stats?.i10_index ? String(citationData.stats.i10_index) : '8', label: 'i10-index' },
      ];
      return (
        <section id="about" style={{ background: '#fff', padding: '96px 24px' }}>
          <div style={{ maxWidth: 'var(--max-w)', margin: '0 auto', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 80, alignItems: 'start' }}>
            <div>
              <SectionLabel color="var(--qub-red)">Overview</SectionLabel>
              <h2 style={{ fontFamily: "'Playfair Display', serif", fontSize: 'clamp(1.8rem, 3vw, 2.4rem)', fontWeight: 700, color: 'var(--qub-navy)', lineHeight: 1.25, marginBottom: 22 }}>
                Academic Profile &amp; Research Focus
              </h2>
              <p style={{ color: '#4b5563', lineHeight: 1.85, marginBottom: 16, fontSize: 15 }}>
                I am a Lecturer (Assistant Professor) in Autonomous Systems at the School of Electronics, Electrical Engineering and Computer Science (EEECS), Queen's University Belfast. My research focuses on safe, reliable, and trustworthy AI for autonomous and intelligent systems, spanning four core strands: <strong>robust sensing for AI</strong>, <strong>run-time monitoring and introspection</strong>, <strong>cooperative autonomy</strong>, and <strong>explainable AI (XAI)</strong>.
              </p>
              <p style={{ color: '#4b5563', lineHeight: 1.85, marginBottom: 30, fontSize: 15 }}>
                Prior to joining QUB, I was a Postdoctoral Research Fellow at WMG, University of Warwick (Feb–Sept 2025), working on EU-funded projects (EVENTS and Hi-Drive) integrating self-assessment frameworks into real-world automated driving pipelines. I completed my PhD in Engineering at Warwick (supervised by Dr. Roger Woodman and Prof. Mehrdad Dianati) and hold an MSc and BSc in Computer Engineering from Middle East Technical University (METU NCC).
              </p>
              <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
                {[['Google Scholar', tweaks.scholarUrl], ['LinkedIn', tweaks.linkedinUrl], ['GitHub', tweaks.githubUrl]].map(([label, url]) => (
                  <a key={label} href={url} target="_blank" rel="noreferrer"
                    style={{ border: '1px solid var(--qub-border)', padding: '8px 16px', borderRadius: 6, fontSize: 13, fontWeight: 500, color: 'var(--qub-navy)', transition: 'all 0.2s', background: '#fff' }}
                    onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--qub-red)'; e.currentTarget.style.color = 'var(--qub-red)'; }}
                    onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--qub-border)'; e.currentTarget.style.color = 'var(--qub-navy)'; }}>
                    {label} ↗
                  </a>
                ))}
              </div>
            </div>
            <div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 28 }}>
                {stats.map(s => (
                  <div key={s.label} style={{ background: 'var(--qub-light)', borderRadius: 10, padding: '24px 20px', textAlign: 'center' }}>
                    <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 36, fontWeight: 700, color: 'var(--qub-navy)', lineHeight: 1 }}>{s.n}</div>
                    <div style={{ fontSize: 12.5, color: '#6b7280', fontWeight: 500, marginTop: 6 }}>{s.label}</div>
                  </div>
                ))}
              </div>
              <div style={{ background: 'var(--qub-navy)', borderRadius: 10, padding: '24px 26px' }}>
                <p style={{ color: 'rgba(255,255,255,0.65)', fontSize: 12, marginBottom: 8, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.08em' }}>Current Appointment &amp; Credentials</p>
                {['Lecturer in Autonomous Systems, Queen\'s University Belfast', 'School of EEECS, Queen\'s University Belfast', 'Associate Fellow, Advance HE (PR307078)', 'Member, IEEE (ITS Society)'].map(a => (
                  <div key={a} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 0', borderBottom: '1px solid rgba(255,255,255,0.07)', color: '#fff', fontSize: 13.5 }}>
                    <span style={{ width: 5, height: 5, borderRadius: '50%', background: 'var(--qub-red)', flexShrink: 0, display: 'block' }}></span>
                    {a}
                  </div>
                ))}
              </div>
            </div>
          </div>
          <style>{`@media(max-width:768px){ #about .two-col { grid-template-columns: 1fr !important; gap: 40px !important; } }`}</style>
        </section>
      );
    }

    /* ── RESEARCH STRANDS ── */
    function Research() {
      const areas = [
        {
          num: '01',
          title: 'Robust Sensing for AI',
          desc: 'Developing multi-modal perception pipelines resilient against adverse environmental conditions, sensor degradations, noise, and domain shifts in real-world deployments.'
        },
        {
          num: '02',
          title: 'Run-Time Monitoring & Introspection',
          desc: 'Designing introspection frameworks and neural activation monitors to detect perception failures, out-of-distribution inputs, and integrity risks before safety incidents occur.'
        },
        {
          num: '03',
          title: 'Cooperative Autonomy',
          desc: 'Investigating resilient collaborative perception, V2X coordination, and distributed decision-making for Connected and Automated Vehicles (CAVs) and multi-agent systems.'
        },
        {
          num: '04',
          title: 'Explainable AI (XAI)',
          desc: 'Creating compact activation encodings, transparent latent representations, and interpretable introspection models to make complex neural perception accountable and explainable.'
        },
      ];
      return (
        <section id="research" style={{ background: 'var(--qub-light)', padding: '96px 24px' }}>
          <div style={{ maxWidth: 'var(--max-w)', margin: '0 auto' }}>
            <div style={{ textAlign: 'center', marginBottom: 56 }}>
              <SectionLabel color="var(--qub-red)" center>Research Strands</SectionLabel>
              <h2 style={{ fontFamily: "'Playfair Display', serif", fontSize: 'clamp(1.8rem, 3vw, 2.5rem)', fontWeight: 700, color: 'var(--qub-navy)', lineHeight: 1.2 }}>
                Core Research Strands
              </h2>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: 24 }}>
              {areas.map(a => (
                <div key={a.title} style={{ background: '#fff', borderRadius: 12, padding: '32px 28px', borderTop: '3px solid var(--qub-red)', transition: 'transform 0.2s, box-shadow 0.2s' }}

    /* ── PUBLICATIONS ── */
    function Publications({ tweaks, citationData }) {
      const pubs = [
        { year: 2026, title: 'ZhadigerAI: Software-as-a-Service AI Platform for Kazakh and English', venue: 'Communications in Computer and Information Science, Springer', type: 'Conference', citations: null, doi: 'https://doi.org/10.1007/978-981-95-6963-2_11' },
        { year: 2025, title: 'Multi-Layer Self-Assessment with Filtering for 3D Object Detection in Autonomous Vehicles', venue: 'ACM Transactions on Intelligent Systems and Technology', type: 'Journal', citations: 1, doi: 'https://doi.org/10.1145/3776551', code: 'https://github.com/yatbazhakan/multi-layer-introspection' },
        { year: 2025, title: 'Hierarchical Human Activity Recognition with Fusion of Audio and Multiple Inertial Sensor Modalities', venue: 'Scientific Reports (Springer Nature)', type: 'Journal', citations: 5, doi: 'https://doi.org/10.1038/s41598-025-29801-w' },
        { year: 2024, title: 'Introspection of DNN-Based Perception Functions in Automated Driving Systems: State-of-the-Art and Open Research Challenges', venue: 'IEEE Transactions on Intelligent Transportation Systems', type: 'Journal', citations: 36, doi: 'https://ieeexplore.ieee.org/document/10463055' },
        { year: 2024, title: 'Run-time Introspection of 2D Object Detection in Automated Driving Systems using Learning Representations', venue: 'IEEE Transactions on Intelligent Vehicles', type: 'Journal', citations: 12, doi: 'https://ieeexplore.ieee.org/document/10387212' },
        { year: 2024, title: 'Integrity Monitoring of 3D Object Detection in Automated Driving Systems using Raw Activation Patterns and Spatial Filtering', venue: 'IEEE Intelligent Transportation Systems Conference (ITSC)', type: 'Conference', citations: 3, doi: 'https://doi.org/10.1109/itsc58415.2024.10920125' },
        { year: 2024, title: 'Run-time Monitoring of 3D Object Detection using Early Layer Neural Activation Patterns', venue: 'IEEE/CVF CVPR Workshops (CVPRW)', type: 'Conference', citations: 9, doi: 'https://openaccess.thecvf.com/content/CVPR2024W/WAD/html/Yatbaz_Run-time_Monitoring_of_3D_Object_Detection_using_Early_Layer_Neural_CVPRW_2024_paper.html' },
        { year: 2022, title: 'An Effective Forest Fire Detection Framework using Heterogeneous Wireless Multimedia Sensor Networks', venue: 'ACM Transactions on Multimedia Computing, Communications, and Applications', type: 'Journal', citations: 111, doi: 'https://dl.acm.org/doi/10.1145/3548456' },
      ];

      const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, '');
      const getCitations = (p) => {
        if (!citationData || !citationData.papers) return p.citations;
        const key = norm(p.title);
        if (typeof citationData.papers[key] === 'number') return citationData.papers[key];
        const prefix = key.slice(0, 30);
        for (const k in citationData.papers) {
          if (k.startsWith(prefix) || key.startsWith(k.slice(0, 30))) {
            return citationData.papers[k];
          }
        }
        return p.citations;
      };

      const pubCount = citationData?.stats?.publications || 21;

      return (
        <section id="publications" style={{ background: '#fff', padding: '96px 24px' }}>
          <div style={{ maxWidth: 'var(--max-w)', margin: '0 auto' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 48, flexWrap: 'wrap', gap: 16 }}>
              <div>
                <SectionLabel color="var(--qub-red)">Publications</SectionLabel>
                <h2 style={{ fontFamily: "'Playfair Display', serif", fontSize: 'clamp(1.8rem, 3vw, 2.5rem)', fontWeight: 700, color: 'var(--qub-navy)' }}>Selected Publications</h2>
              </div>
              <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                <a href="publications.html" style={{ fontSize: 13, fontWeight: 600, color: '#fff', background: 'var(--qub-red)', padding: '9px 18px', borderRadius: 8, transition: 'all 0.2s' }}
                  onMouseEnter={e => e.target.style.background = 'var(--qub-red-dark)'}
                  onMouseLeave={e => e.target.style.background = 'var(--qub-red)'}>
                  {`All Publications (${pubCount}) →`}
                </a>
                <a href={tweaks ? tweaks.scholarUrl : 'https://scholar.google.com/citations?user=5Q596f4AAAAJ'} target="_blank" rel="noreferrer" style={{ fontSize: 13, fontWeight: 600, color: 'var(--qub-red)', border: '1px solid var(--qub-red)', padding: '9px 18px', borderRadius: 8, transition: 'all 0.2s' }}
                  onMouseEnter={e => { e.target.style.background = 'rgba(200,16,46,0.06)'; }}
                  onMouseLeave={e => { e.target.style.background = 'transparent'; }}>
                  Google Scholar ↗
                </a>
              </div>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column' }}>
              {pubs.map((p, i) => {
                const citeCount = getCitations(p);
                return (
                  <div key={i} style={{ display: 'grid', gridTemplateColumns: '60px 1fr auto', gap: 20, padding: '24px 0', borderBottom: '1px solid var(--qub-border)', alignItems: 'start' }}
                    onMouseEnter={e => e.currentTarget.style.background = '#fafafa'}
                    onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                    <div style={{ textAlign: 'center' }}>
                      <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 18, fontWeight: 700, color: 'var(--qub-red)' }}>{p.year}</div>
                    </div>
                    <div>
                      <p style={{ fontWeight: 600, color: 'var(--qub-navy)', fontSize: 15, marginBottom: 6, lineHeight: 1.4 }}>
                        {p.doi ? (
                          <a href={p.doi} target="_blank" rel="noreferrer" style={{ color: 'inherit', textDecoration: 'none' }}
                            onMouseEnter={e => e.target.style.color = 'var(--qub-red)'}
                            onMouseLeave={e => e.target.style.color = 'var(--qub-navy)'}>
                            {p.title}
                          </a>
                        ) : p.title}
                      </p>
                      <p style={{ color: '#6b7280', fontSize: 13 }}>{p.venue}</p>
                    </div>
                    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 6, flexShrink: 0 }}>
                      <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
                        <span style={{ fontSize: 11, fontWeight: 600, padding: '3px 10px', borderRadius: 12, background: p.type === 'Journal' ? '#f0fdf4' : '#eff6ff', color: p.type === 'Journal' ? '#166534' : '#1d4ed8', letterSpacing: '0.04em' }}>{p.type}</span>
                        {p.code && (
                          <a href={p.code} target="_blank" rel="noreferrer"
                            style={{ fontSize: 11, fontWeight: 600, padding: '3px 9px', borderRadius: 12, background: 'rgba(0,0,0,0.06)', color: 'var(--qub-navy)', border: '1px solid var(--qub-border)', textDecoration: 'none' }}
                            onMouseEnter={e => e.target.style.borderColor = 'var(--qub-red)'}
                            onMouseLeave={e => e.target.style.borderColor = 'var(--qub-border)'}>
                            Code
                          </a>
                        )}
                      </div>
                      {typeof citeCount === 'number' && citeCount > 0 && (
                        <span style={{ fontSize: 11, color: '#9ca3af' }}>{citeCount} citation{citeCount > 1 ? 's' : ''}</span>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </section>
      );
    }
