# Research strands — used on the home page (Throughline legend, Vision band, Collaborate) and the PhD page (`phd`).

- num: "01"
  roman: "I"
  lane: "sensing"
  lane_label: "Sensing"
  title: "Robust & Self-Calibrating 3D Sensing in Autonomy"
  short_desc: "Multi-modal 2D/3D perception under weather and sensor noise."
  summary: "Multi-modal perception pipelines that stay reliable under adverse weather, sensor degradation, noise, and domain shift in real-world deployments."
  phd: "Designing self-calibrating and self-healing 3D perception pipelines (LiDAR, Radar, Camera BEV) that automatically diagnose domain shift, recover sub-threshold missed road users, and adapt multi-sensor fusion weights online under severe weather and sensor degradation."
  tags:
    - "Multi-modal 3D fusion"
    - "Self-healing perception"
    - "Domain shift & weather"

- num: "02"
  roman: "II"
  lane: "introspection"
  lane_label: "Introspection"
  title: "Anticipatory Introspection & Self-Correcting Autonomy"
  short_desc: "Run-time monitors that flag perception errors without ground truth."
  summary: "Introspection frameworks and neural activation monitors that detect perception failures and out-of-distribution inputs before they become safety incidents."
  phd: "Moving beyond passive error alarms to proactive, latent-steered autonomy — probing compact spatio-temporal neural activations to anticipate perception and tracking failures 1–2 seconds ahead and actively steer end-to-end (E2E) driving trajectories and closed-loop control."
  tags:
    - "Failure anticipation"
    - "Latent-steered E2E driving"
    - "AI safety & control"

- num: "03"
  roman: "III"
  lane: "xai"
  lane_label: "Representations"
  title: "Causally Faithful Embodied VLMs & Latent Representations"
  short_desc: "Early-layer neural activations and compact latent encodings."
  summary: "Compact activation encodings and interpretable latent representations that make neural perception transparent and accountable."
  phd: "Auditing and eliminating statistical shortcut learning in Embodied Vision-Language Models (VLMs/VLAs) and Bird's-Eye-View networks — building counterfactual training and inference regularisers alongside ultra-compact latent representations that ground decisions in physical evidence."
  tags:
    - "Embodied VLMs / VLAs"
    - "Shortcut & confounder auditing"
    - "Compact latent probing"

- num: "04"
  roman: "IV"
  lane: "autonomy"
  lane_label: "Autonomy"
  title: "Cooperative Autonomy & Anticipatory Teleoperation"
  short_desc: "Spatial filtering and collaborative V2X for resilient autonomy."
  summary: "Resilient collaborative perception, V2X coordination, and distributed decision-making for connected and automated vehicles and multi-agent systems."
  phd: "Developing bandwidth-constrained cooperative perception (V2X), resilient multi-agent coordination, and anticipatory human-AI shared control / remote teleoperation under wireless network latency for connected vehicles and field robotics."
  tags:
    - "Cooperative V2X autonomy"
    - "Networked teleoperation"
    - "Human-AI shared control"
