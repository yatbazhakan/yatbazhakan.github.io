# Research strands — used on the home page (Throughline legend, Vision band, Collaborate) and the PhD page (`phd`).

- num: "01"
  roman: "I"
  lane: "sensing"
  lane_label: "Sensing"
  title: "Robust Sensing for AI in Autonomy"
  short_desc: "Multi-modal 2D/3D perception under weather and sensor noise."
  summary: "Multi-modal perception pipelines that stay reliable under adverse weather, sensor degradation, noise, and domain shift in real-world deployments."
  phd: "Quantifying and mitigating perception degradation in adverse operating conditions (weather, sensor noise, occlusion, degradation) and domain shifts through resilient multi-modal sensor fusion and adaptive processing."
  tags:
    - "Multi-modal fusion"
    - "LiDAR & camera"
    - "Adverse weather"

- num: "02"
  roman: "II"
  lane: "introspection"
  lane_label: "Introspection"
  title: "Run-Time Monitoring & Introspection"
  short_desc: "Run-time monitors that flag perception errors without ground truth."
  summary: "Introspection frameworks and neural activation monitors that detect perception failures and out-of-distribution inputs before they become safety incidents."
  phd: "Investigating neural activation dynamics, epistemic uncertainty estimation, and real-time failure detection so that deep learning perception operates reliably and safely under out-of-distribution conditions."
  tags:
    - "DNN introspection"
    - "3D object detection"
    - "AI safety"

- num: "03"
  roman: "III"
