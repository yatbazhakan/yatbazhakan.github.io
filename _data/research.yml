# Research strands — used on the home page (`summary`) and the PhD page (`phd`).

- num: "01"
  title: "Robust Sensing for AI in Autonomy"
  summary: "Multi-modal perception pipelines that stay reliable under adverse weather, sensor degradation, noise, and domain shift in real-world deployments."
  phd: "Quantifying and mitigating perception degradation in adverse operating conditions (weather, sensor noise, occlusion, degradation) and domain shifts through resilient multi-modal sensor fusion and adaptive processing."

- num: "02"
  title: "Run-Time Monitoring & Introspection"
  summary: "Introspection frameworks and neural activation monitors that detect perception failures and out-of-distribution inputs before they become safety incidents."
  phd: "Investigating neural activation dynamics, epistemic uncertainty estimation, and real-time failure detection so that deep learning perception operates reliably and safely under out-of-distribution conditions."

- num: "03"
  title: "Cooperative Autonomy"
  summary: "Resilient collaborative perception, V2X coordination, and distributed decision-making for connected and automated vehicles and multi-agent systems."
  phd: "Developing multi-agent collaborative perception frameworks, spatial filtering, and resilient coordination mechanisms for fault tolerance in connected and automated vehicles (CAVs) and multi-agent systems."

- num: "04"
  title: "Explainable AI (XAI)"
  summary: "Compact activation encodings and interpretable latent representations that make neural perception transparent and accountable."
  phd: "Designing compact, explainable neural activation encodings and interpretable latent representations for real-time introspective safety monitoring, transparency, and accountability in autonomous and intelligent systems."
