# PhD FAQ — rendered on /phd/ and emitted as FAQPage structured data for search engines.
# Answers may contain simple HTML.

- q: "Are PhD studentships available for UK and Republic of Ireland students?"
  a: "Yes. Competitive DfE and EPSRC Postgraduate Studentships at Queen's University Belfast cover <strong>100% of Home tuition fees plus a tax-free maintenance stipend</strong> (approx. £21,805 per year for 3–3.5 years). Both <strong>UK nationals and Republic of Ireland nationals</strong> (as well as candidates with UK settled or pre-settled status) qualify as Home students."

- q: "What is the application deadline for October 2027 entry?"
  a: "Formal applications for our advertised October 2027 PhD projects (<code>EEECS27/HY1</code> and <code>EEECS27/YH2</code>, starting 1 October 2027) close on <strong>Friday, 5 February 2027</strong> via the <a href=\"https://go.qub.ac.uk/pgapply\" target=\"_blank\" rel=\"noopener\">Queen's Postgraduate Applications Portal</a>. Informal email enquiries ahead of submission are warmly encouraged."

- q: "Can international candidates apply, and are there specific School rules?"
  a: "Yes. A small, highly competitive pool of International scholarships is allocated across the School of EEECS. Please note two strict School rules: (1) international applicants may apply to a <strong>maximum of two projects across the entire School of EEECS</strong> (applying to three or more risks rejection), and (2) complete Bachelor's (and Master's, if applicable) academic transcripts must be uploaded at submission. Email <a href=\"mailto:h.yatbaz@qub.ac.uk\">h.yatbaz@qub.ac.uk</a> first for an informal fit check."

- q: "Can I apply while I am still finishing my undergraduate or Master's degree?"
  a: "Yes. Applicants should hold <em>or expect to achieve</em> a First Class or Upper Second Class (2:1) Honours degree, or an equivalent Master's degree. Final-year students from Queen's, Ulster University, and universities across the island of Ireland and Great Britain are very welcome to get in touch before graduating."

- q: "Do I need prior experience with autonomous vehicles or ROS 2?"
  a: "No. Strong fundamentals in Computer Science, EEE, Robotics, AI, or Applied Mathematics alongside solid programming in <strong>Python (e.g., PyTorch) or C++</strong> are what count on day one. Domain skills in CARLA simulation, ROS 2, and multi-sensor perception setups are built during the PhD with full support from our group."
