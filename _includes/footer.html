<footer class="site-footer">
  <div class="wrap site-footer__grid">
    <div class="site-footer__id">
      <svg class="logomark" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
        <rect class="logomark__cell" x="1.625" y="1.625" width="4.75" height="4.75" rx="1"/>
        <rect class="logomark__cell logomark__cell--on" x="9" y="1" width="6" height="6" rx="1"/>
        <rect class="logomark__cell" x="1.625" y="9.625" width="4.75" height="4.75" rx="1"/>
        <rect class="logomark__cell" x="9.625" y="9.625" width="4.75" height="4.75" rx="1"/>
      </svg>
      <p>{{ site.author.name }} · {{ site.author.institution }}</p>
    </div>
    <ul class="site-footer__links">
      <li><a href="mailto:{{ site.author.email }}" aria-label="Email"><svg class="icon" width="18" height="18" aria-hidden="true" focusable="false"><use href="{{ '/assets/icons/sprite.svg#mail' | relative_url }}"/></svg></a></li>
      <li><a href="{{ site.author.scholar }}" target="_blank" rel="noopener" aria-label="Google Scholar"><svg class="icon" width="18" height="18" aria-hidden="true" focusable="false"><use href="{{ '/assets/icons/sprite.svg#scholar' | relative_url }}"/></svg></a></li>
      <li><a href="{{ site.author.github }}" target="_blank" rel="noopener" aria-label="GitHub"><svg class="icon" width="18" height="18" aria-hidden="true" focusable="false"><use href="{{ '/assets/icons/sprite.svg#github' | relative_url }}"/></svg></a></li>
      <li><a href="{{ site.author.linkedin }}" target="_blank" rel="noopener" aria-label="LinkedIn"><svg class="icon" width="18" height="18" aria-hidden="true" focusable="false"><use href="{{ '/assets/icons/sprite.svg#linkedin' | relative_url }}"/></svg></a></li>
    </ul>
    <div class="site-footer__meta">
      <p>{{ site.author.department_short }} · <a class="link-quiet" href="#content">Back to top<svg class="icon" width="14" height="14" aria-hidden="true" focusable="false"><use href="{{ '/assets/icons/sprite.svg#arrow-up' | relative_url }}"/></svg></a></p>
      <p class="site-footer__colophon">Set in Newsreader, Inter and JetBrains Mono. {{ site.author.office }}, Belfast, UK.<br><small class="site-footer__credit">Design adapted from <a class="link-quiet" href="https://guanxiongsun.github.io" target="_blank" rel="noopener">Guanxiong Sun</a>.</small></p>
    </div>
  </div>
</footer>
