  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "EducationalOccupationalProgram",
        "@id": "{{ '/phd/#program' | absolute_url }}",
        "name": "PhD in Autonomous Systems and Artificial Intelligence",
        "description": "Doctoral research program in safe, reliable, and trustworthy AI for autonomous systems, supervised by Dr. Hakan Yekta Yatbaz at Queen's University Belfast.",
        "educationalProgramMode": "Full-time",
        "timeToComplete": "P3Y6M",
        "programPrerequisites": "First Class or Upper Second Class (2:1) Honours Degree in Computer Science, Machine Learning, Robotics, or Electrical & Electronic Engineering",
        "provider": {
          "@type": "CollegeOrUniversity",
          "name": "Queen's University Belfast",
          "alternateName": "QUB",
          "url": "https://www.qub.ac.uk",
          "department": "School of Electronics, Electrical Engineering and Computer Science (EEECS)",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Ashby Building, Stranmillis Road",
            "addressLocality": "Belfast",
            "addressRegion": "Northern Ireland",
            "postalCode": "BT9 5AH",
            "addressCountry": "GB"
          }
        },
        "financialAidEligible": "Fully funded DfE Northern Ireland Postgraduate Studentships covering 100% tuition fees and £19,000+/year living stipend. Republic of Ireland citizens qualify for domestic Home Fee status under the Common Travel Area.",
        "occupationalCategory": "Academic Researcher / Autonomous Systems Research Scientist"
      },
      {
        "@type": "FAQPage",
        "mainEntity": [
          {%- for f in site.data.faq %}
          {
            "@type": "Question",
            "name": {{ f.q | jsonify }},
            "acceptedAnswer": {
              "@type": "Answer",
              "text": {{ f.a | strip_html | jsonify }}
            }
          }{% unless forloop.last %},{% endunless %}
          {%- endfor %}
        ]
      }
    ]
  }
  </script>
