  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "EducationalOccupationalProgram",
        "@id": "{{ '/phd/#program' | absolute_url }}",
        "name": "PhD in Autonomous Systems and Artificial Intelligence",
        "description": "Doctoral research program in safe, reliable, and self-correcting AI for autonomous vehicles, 3D computer vision, vision-language models, and robotics, supervised by Dr. Hakan Yekta Yatbaz at Queen's University Belfast.",
        "educationalProgramMode": "Full-time",
        "timeToComplete": "P3Y6M",
        "programPrerequisites": "First Class or Upper Second Class (2:1) Honours Degree in Computer Science, Machine Learning, Robotics, Electrical & Electronic Engineering, Physics, Applied Mathematics, or Mechanical/Aerospace Engineering",
        "provider": {
          "@type": "CollegeOrUniversity",
          "name": "Queen's University Belfast",
          "alternateName": "QUB",
          "url": "https://www.qub.ac.uk",
          "department": "School of Electronics, Electrical Engineering and Computer Science (EEECS)",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Ashby Building, Stranmillis Road",
            "addressLocality": "Belfast",
            "addressRegion": "Northern Ireland",
            "postalCode": "BT9 5AH",
            "addressCountry": "GB"
          }
        },
        "financialAidEligible": "Ring-fenced, fully funded DfE Northern Ireland Postgraduate Studentship covering 100% Home tuition fees and £19,237–£20,780/year tax-free living stipend. Open to UK/NI nationals, Republic of Ireland citizens under the Common Travel Area, and candidates with EU Settled Status or Indefinite Leave to Remain (ILR).",
        "occupationalCategory": "Academic Researcher / Autonomous Systems & AI Research Scientist"
      },
      {
        "@type": "FAQPage",
        "mainEntity": [
          {%- for f in site.data.faq %}
          {
            "@type": "Question",
            "name": {{ f.q | jsonify }},
            "acceptedAnswer": {
              "@type": "Answer",
              "text": {{ f.a | strip_html | jsonify }}
            }
          }{% unless forloop.last %},{% endunless %}
          {%- endfor %}
        ]
      }
    ]
  }
  </script>
